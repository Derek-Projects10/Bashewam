<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bashewam School - Exam Room Placement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        
        .sidebar {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        
        .content {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #3498db;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #27ae60;
            color: white;
        }
        
        .btn-success:hover {
            background: #219a52;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #34495e;
            color: white;
        }
        
        tr:hover {
            background: #f1f8ff;
        }
        
        .room-card {
            background: white;
            border: 2px solid #3498db;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
        }
        
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .room-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .capacity {
            background: #3498db;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .student-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .student-item {
            padding: 8px 12px;
            background: #f8f9fa;
            margin: 6px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #2c3e50;
            color: white;
            font-size: 0.9rem;
        }
        
        .assignment-result {
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bashewam School</h1>
            <p>Examination Room Placement System</p>
        </header>
        
        <div class="main">
            <!-- Sidebar: Input -->
            <div class="sidebar">
                <h2>Add Students</h2>
                <div class="form-group">
                    <label for="studentName">Student Full Name</label>
                    <input type="text" id="studentName" placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g. BS2023001">
                </div>
                <div class="form-group">
                    <label for="studentClass">Class / Grade</label>
                    <select id="studentClass">
                        <option value="Grade 9">Grade 9</option>
                        <option value="Grade 10">Grade 10</option>
                        <option value="Grade 11" selected>Grade 11</option>
                        <option value="Grade 12">Grade 12</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="addStudent()">Add Student</button>
                
                <hr style="margin: 30px 0;">
                
                <h2>Add Exam Room</h2>
                <div class="form-group">
                    <label for="roomName">Room Name / Number</label>
                    <input type="text" id="roomName" placeholder="e.g. Hall A or Room 105">
                </div>
                <div class="form-group">
                    <label for="roomCapacity">Capacity (Seats)</label>
                    <input type="number" id="roomCapacity" value="30" min="1">
                </div>
                <button class="btn-primary" onclick="addRoom()">Add Room</button>
                
                <hr style="margin: 30px 0;">
                
                <button class="btn-success" style="width: 100%; padding: 15px;" onclick="autoAssign()">
                     Auto Assign Students to Rooms
                </button>
                
                <button class="btn-danger" style="width: 100%; margin-top: 10px;" onclick="clearAll()">
                    Clear All Data
                </button>
            </div>
            
            <!-- Main Content -->
            <div class="content">
                <h2>Students List (<span id="studentCount">0</span>)</h2>
                <table id="studentsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
                
                <h2 style="margin-top: 40px;">Exam Rooms</h2>
                <div id="roomsContainer">
                    <!-- Populated by JS -->
                </div>
                
                <div class="assignment-result" id="assignmentResult">
                    <h2>Assignment Result</h2>
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            © 2026 Bashewam School • Examination Management System
        </div>
    </div>

    <script>
        let students = [];
        let rooms = [];
        
        // Sample data
        function loadSampleData() {
            students = [
                { id: "BS2023101", name: "Abebe Kebede", class: "Grade 11" },
                { id: "BS2023102", name: "Mekdes Tesfaye", class: "Grade 11" },
                { id: "BS2023103", name: "Samuel Alemayehu", class: "Grade 11" },
                { id: "BS2023104", name: "Sara Getachew", class: "Grade 11" },
                { id: "BS2023105", name: "Yonas Hailu", class: "Grade 11" },
            ];
            
            rooms = [
                { name: "Hall A", capacity: 35, assigned: [] },
                { name: "Room 105", capacity: 25, assigned: [] },
                { name: "Room 106", capacity: 30, assigned: [] },
            ];
            
            renderAll();
        }
        
        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const id = document.getElementById('studentId').value.trim();
            const studentClass = document.getElementById('studentClass').value;
            
            if (!name || !id) {
                alert("Please enter both student name and ID!");
                return;
            }
            
            students.push({
                id: id,
                name: name,
                class: studentClass
            });
            
            document.getElementById('studentName').value = '';
            document.getElementById('studentId').value = '';
            
            renderAll();
        }
        
        function addRoom() {
            const name = document.getElementById('roomName').value.trim();
            const capacity = parseInt(document.getElementById('roomCapacity').value);
            
            if (!name || !capacity) {
                alert("Please enter room name and capacity!");
                return;
            }
            
            rooms.push({
                name: name,
                capacity: capacity,
                assigned: []
            });
            
            document.getElementById('roomName').value = '';
            renderAll();
        }
        
        function deleteStudent(index) {
            students.splice(index, 1);
            renderAll();
        }
        
        function deleteRoom(index) {
            rooms.splice(index, 1);
            renderAll();
        }
        
        function renderStudents() {
            const tbody = document.getElementById('studentsBody');
            tbody.innerHTML = '';
            
            students.forEach((student, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.class}</td>
                    <td><button class="btn-danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="deleteStudent(${index})">Remove</button></td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('studentCount').textContent = students.length;
        }
        
        function renderRooms() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';
            
            rooms.forEach((room, index) => {
                const roomDiv = document.createElement('div');
                roomDiv.className = 'room-card';
                roomDiv.innerHTML = `
                    <div class="room-header">
                        <div class="room-name">${room.name}</div>
                        <div class="capacity">${room.assigned.length} / ${room.capacity}</div>
                    </div>
                    <div class="student-list" id="room-students-${index}">
                        <!-- Filled dynamically -->
                    </div>
                    <button class="btn-danger" style="margin-top: 12px; padding: 8px 16px;" onclick="deleteRoom(${index})">Delete Room</button>
                `;
                container.appendChild(roomDiv);
                
                // Render assigned students
                const studentsList = document.getElementById(`room-students-${index}`);
                if (room.assigned.length > 0) {
                    room.assigned.forEach(student => {
                        const sDiv = document.createElement('div');
                        sDiv.className = 'student-item';
                        sDiv.innerHTML = `
                            <span>${student.id} - ${student.name}</span>
                            <small>${student.class}</small>
                        `;
                        studentsList.appendChild(sDiv);
                    });
                } else {
                    studentsList.innerHTML = `<p style="color: #999; text-align: center; padding: 20px;">No students assigned yet</p>`;
                }
            });
        }
        
        function autoAssign() {
            // Reset assignments
            rooms.forEach(room => room.assigned = []);
            
            // Simple sequential assignment
            let studentIndex = 0;
            
            for (let room of rooms) {
                while (room.assigned.length < room.capacity && studentIndex < students.length) {
                    room.assigned.push(students[studentIndex]);
                    studentIndex++;
                }
            }
            
            // Show remaining unassigned students
            const unassigned = students.slice(studentIndex);
            
            let html = `<h3 style="color: #27ae60;">✅ Assignment Completed!</h3>`;
            
            if (unassigned.length > 0) {
                html += `<p style="color: #e67e22; margin: 15px 0;"><strong>${unassigned.length} students could not be assigned (no space left).</strong></p>`;
            }
            
            html += `<button class="btn-primary" onclick="printPlacement()" style="margin-top: 15px;">🖨️ Print Placement</button>`;
            
            document.getElementById('resultContent').innerHTML = html;
            
            renderAll();
        }
        
        function printPlacement() {
            const printWindow = window.open('', '_blank');
            let printContent = `
                <html>
                <head>
                    <title>Bashewam School - Exam Placement</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 40px; }
                        h1 { text-align: center; color: #2c3e50; }
                        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                        th, td { border: 1px solid #333; padding: 10px; }
                        th { background: #34495e; color: white; }
                    </style>
                </head>
                <body>
                    <h1>Bashewam School - Final Exam Room Placement</h1>
                    <p style="text-align: center;">Date: ${new Date().toLocaleDateString()}</p>
            `;
            
            rooms.forEach(room => {
                printContent += `
                    <h2>\( {room.name} ( \){room.assigned.length}/${room.capacity})</h2>
                    <table>
                        <tr>
                            <th>Student ID</th>
                            <th>Full Name</th>
                            <th>Class</th>
                        </tr>
                `;
                
                room.assigned.forEach(student => {
                    printContent += `
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.class}</td>
                        </tr>
                    `;
                });
                
                printContent += `</table><br>`;
            });
            
            printContent += `</body></html>`;
            
            printWindow.document.write(printContent);
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => printWindow.print(), 500);
        }
        
        function clearAll() {
            if (confirm("Clear ALL students and rooms?")) {
                students = [];
                rooms = [];
                document.getElementById('resultContent').innerHTML = '';
                renderAll();
            }
        }
        
        function renderAll() {
            renderStudents();
            renderRooms();
        }
        
        // Initialize
        window.onload = function() {
            loadSampleData();
        };
    </script>
</body>
</html>
