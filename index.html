<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bashewam School - Exam Room Placement</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #2c3e50, #1a2533);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 { font-size: 2.4rem; margin-bottom: 8px; }
        
        .main {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        
        .sidebar, .content {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #3498db;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; transform: translateY(-2px); }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }
        
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th { background: #34495e; color: white; }
        tr:hover { background: #f1f8ff; }
        
        .room-card {
            background: white;
            border: 2px solid #3498db;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }
        
        .rank-badge {
            background: #f39c12;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #2c3e50;
            color: white;
            font-size: 0.95rem;
        }
        .inline-emoji {
    height: 1.2em;       /* Scales perfectly with whatever font size you use */
    width: auto;         /* Keeps the image perfectly square/proportional */
    vertical-align: -0.2em; /* Aligns it perfectly with the baseline of the text */
    display: inline-block;
    margin: 0 2px;       /* Adds a tiny bit of breathing room on the sides */
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><img src="Bashlogo.jpg" class="inline-emoji" alt="School Badge"> Bashewam School</h1>
            <p>Examination Room Placement System</p>
        </header>
        
        <div class="main">
            <!-- Sidebar -->
            <div class="sidebar">
                <h2>Add Student</h2>
                <div class="form-group">
                    <label>Student Full Name</label>
                    <input type="text" id="studentName" placeholder="e.g. Abebe Kebede">
                </div>
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g. BS2023102">
                </div>
                <div class="form-group">
                    <label>Class / Section</label>
                    <select id="studentClass">
                        <option value="Grade 11A">Grade 11A</option>
                        <option value="Grade 11B">Grade 11B</option>
                        <option value="Grade 11C">Grade 11C</option>
                        <option value="Grade 11D" selected>Grade 11D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Rank (1 = Best)</label>
                    <input type="number" id="studentRank" value="1" min="1">
                </div>
                <button class="btn-primary" onclick="addStudent()">Add Student</button>

                <hr style="margin: 30px 0;">

                <h2>Add Exam Room</h2>
                <div class="form-group">
                    <label>Room Name / Number</label>
                    <input type="text" id="roomName" placeholder="e.g. Room A">
                </div>
                <div class="form-group">
                    <label>Capacity</label>
                    <input type="number" id="roomCapacity" value="25" min="1">
                </div>
                <button class="btn-primary" onclick="addRoom()">Add Room</button>

                <hr style="margin: 30px 0;">

                <button class="btn-success" style="width:100%; padding:16px; font-size:1.1rem;" onclick="autoAssign(false)">
                    🔄 Normal Assignment
                </button>
                <button class="btn-info" style="width:100%; margin-top:10px; padding:16px; font-size:1.1rem;" onclick="autoAssign(true)">
                    🏆 Assign by Rank (Best First)
                </button>
                
                <button class="btn-danger" style="width:100%; margin-top:15px;" onclick="clearAll()">
                    Clear All Data
                </button>
            </div>

            <!-- Main Content -->
            <div class="content">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>Students List (<span id="studentCount">0</span>)</h2>
                    <button class="btn-primary" onclick="sortByRank()">Sort by Rank</button>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentsBody"></tbody>
                </table>

                <h2 style="margin-top: 40px;">Exam Rooms</h2>
                <div id="roomsContainer"></div>

                <div id="resultContent" style="margin-top: 30px;"></div>
            </div>
        </div>
        
        <div class="footer">
            © 2026 Bashewam School • Smart Exam Room Placement System
        </div>
    </div>

    <script>
        let students = [];
        let rooms = [];

        function loadSampleData() {
            students = [
                { id: "BS2023101", name: "Derek John", class: "Grade 11A", rank: 3 },
                { id: "BS2023102", name: "Nahom Dereje", class: "Grade 11B", rank: 1 },
                { id: "BS2023103", name: "Edom Gezahegn", class: "Grade 11C", rank: 5 },
                { id: "BS2023104", name: "Betelhem Kifle", class: "Grade 11D", rank: 2 },
                { id: "BS2023105", name: "Bezawit Ashenafi", class: "Grade 11D", rank: 4 },
                { id: "BS2023106", name: "Olyana Geremew", class: "Grade 11A", rank: 6 },
                { id: "BS2023107", name: "Ziyad Siraj", class: "Grade 11B", rank: 8 },
                { id: "BS2023108", name: "Dawit Birhanu", class: "Grade 11C", rank: 7 },
            ];
            
            rooms = [
                { name: "Room A", capacity: 3, assigned: [] },
                { name: "Room B", capacity: 2, assigned: [] },
                { name: "Room C", capacity: 3, assigned: [] },
            ];
            renderAll();
        }

        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const id = document.getElementById('studentId').value.trim();
            const studentClass = document.getElementById('studentClass').value;
            const rank = parseInt(document.getElementById('studentRank').value) || 999;

            if (!name || !id) {
                alert("Name and Student ID are required!");
                return;
            }

            students.push({ id, name, class: studentClass, rank });
            document.getElementById('studentName').value = '';
            document.getElementById('studentId').value = '';
            renderAll();
        }

        function addRoom() {
            const name = document.getElementById('roomName').value.trim();
            const capacity = parseInt(document.getElementById('roomCapacity').value);

            if (!name || !capacity) {
                alert("Room name and capacity are required!");
                return;
            }

            rooms.push({ name, capacity, assigned: [] });
            document.getElementById('roomName').value = '';
            renderAll();
        }

        function deleteStudent(index) {
            students.splice(index, 1);
            renderAll();
        }

        function deleteRoom(index) {
            rooms.splice(index, 1);
            renderAll();
        }

        function sortByRank() {
            students.sort((a, b) => a.rank - b.rank);
            renderAll();
        }

        function autoAssign(byRank = false) {
            rooms.forEach(room => room.assigned = []);

            let sortedStudents = [...students];
            if (byRank) {
                sortedStudents.sort((a, b) => a.rank - b.rank); // Best rank first
            }

            let studentIndex = 0;
            for (let room of rooms) {
                while (room.assigned.length < room.capacity && studentIndex < sortedStudents.length) {
                    room.assigned.push(sortedStudents[studentIndex]);
                    studentIndex++;
                }
            }

            const unassignedCount = sortedStudents.length - studentIndex;
            
            let html = `<h3 style="color: ${byRank ? '#27ae60' : '#3498db'};">`;
            html += byRank ? '🏆 Assignment by Rank Completed!' : '✅ Normal Assignment Completed!';
            html += `</h3>`;

            if (unassignedCount > 0) {
                html += `<p style="color:#e67e22;"><strong>${unassignedCount} students could not be placed.</strong></p>`;
            }

            html += `<button class="btn-primary" onclick="printPlacement()" style="margin-top:15px;">🖨️ Print Placement Sheet</button>`;
            
            document.getElementById('resultContent').innerHTML = html;
            renderAll();
        }

        function renderStudents() {
            const tbody = document.getElementById('studentsBody');
            tbody.innerHTML = '';

            students.forEach((student, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="rank-badge">${student.rank}</span></td>
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.class}</td>
                    <td><button class="btn-danger" style="padding:6px 12px;" onclick="deleteStudent(${index})">Remove</button></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('studentCount').textContent = students.length;
        }

        function renderRooms() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';

            rooms.forEach((room, index) => {
                const div = document.createElement('div');
                div.className = 'room-card';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h3>${room.name}</h3>
                        <span class="rank-badge">${room.assigned.length} / ${room.capacity}</span>
                    </div>
                    <div style="max-height:280px; overflow-y:auto;" id="room-list-${index}"></div>
                    <button class="btn-danger" style="margin-top:10px;" onclick="deleteRoom(${index})">Delete Room</button>
                `;
                container.appendChild(div);

                const listDiv = document.getElementById(`room-list-${index}`);
                if (room.assigned.length === 0) {
                    listDiv.innerHTML = `<p style="color:#999; text-align:center; padding:20px;">No students assigned</p>`;
                } else {
                    room.assigned.forEach(s => {
                        const item = document.createElement('div');
                        item.style.cssText = 'padding:10px; background:#f1f8ff; margin:6px 0; border-radius:6px; display:flex; justify-content:space-between;';
                        item.innerHTML = `
                            <span><strong>${s.rank}</strong> - ${s.id} ${s.name}</span>
                            <small>${s.class}</small>
                        `;
                        listDiv.appendChild(item);
                    });
                }
            });
        }

        function printPlacement() {
            const win = window.open('', '_blank');
            let content = `
                <html><head><title>Bashewam School - Exam Placement</title>
                <style>
                    body { font-family: Arial; margin: 40px; }
                    h1, h2 { text-align: center; }
                    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                    th, td { border: 1px solid black; padding: 10px; }
                    th { background: #2c3e50; color: white; }
                </style>
                </head><body>
                <h1>Bashewam School - Final Exam Room Placement</h1>
                <p style="text-align:center;">Date: ${new Date().toLocaleDateString()}</p>
            `;

            rooms.forEach(room => {
                content += `<h2 align="center">${room.name} (${room.assigned.length}/${room.capacity})</h2>`;
                content += `<table><tr><th>Rank</th><th>ID</th><th>Name</th><th>Class</th></tr>`;
                
                room.assigned.forEach(s => {
                    content += `<tr><td>${s.rank}</td><td>${s.id}</td><td>${s.name}</td><td>${s.class}</td></tr>`;
                });
                content += `</table><br>`;
            });

            content += `</body></html>`;
            win.document.write(content);
            win.document.close();
            setTimeout(() => win.print(), 600);
        }

        function clearAll() {
            if (confirm("Clear all students and rooms?")) {
                students = [];
                rooms = [];
                document.getElementById('resultContent').innerHTML = '';
                renderAll();
            }
        }

        function renderAll() {
            renderStudents();
            renderRooms();
        }

        window.onload = loadSampleData;
    </script>
</body>
</html>
